name: Publish to PyPI
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  pypi:
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install build
      - run: pip install -e ".[dev]" && pytest -q
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
