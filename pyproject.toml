[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "souqnorm"
version = "0.2.1"
description = "Normalization, size parsing and keyword expansion for Arabic/English e-commerce search queries"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Muhammad Tanzeel", email = "mtanzil666@gmail.com" }]
keywords = ["arabic", "nlp", "e-commerce", "search", "query normalization", "information retrieval"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Natural Language :: Arabic",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/mtanzil6/souqnorm"
Issues = "https://github.com/mtanzil6/souqnorm/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
souqnorm = "souqnorm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--doctest-modules"
testpaths = ["tests", "src"]
